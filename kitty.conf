#FONTS
#/////////////////////////////////////////////////////
font_family      JetBrainsMono Nerd Font

italic_font      JetBrainsMono Nerd Font Italic
bold_font        JetBrainsMono Nerd Font Bold
bold_italic_font JetBrainsMono Nerd Font Bold Italic
font_size 12

adjust_line_height 4
adjust_column_width 1
disable_ligatures never
#/////////////////////////////////////////////////////

#WINDOW BEHAVIOR
window_padding_width 14
enable_audio_bell no
remember_window_size no
placement_strategy center
hide_window_decorations titlebar-only
#////////////////////////////////////////////////////

#PERFORMANCE
repaint_delay 10
input_delay   1
sync_to_monitor yes
#///////////////////////////////////////////////////

#SCROLLBACK
scrollback_lines 5000
scrollback_pager_history_size 64
#///////////////////////////////////////////////////

#KEYBINDS
##NEW WINDOW
map ctrl+shift+\ new_window
map ctrl+shift+h  previous_window
map ctrl+shift+l next_window
map ctrl+shift+q     close_window
map F1 new_window_with_cwd
map F2 launch --cwd=current /usr/bin/vi .

## SAME WINDOW DIFFERENT TERMS
### CTRL L to change layout
### LAYOUT

enabled_layouts tall,*

### MARGINES BETWEEN WINDOWS
#### CTRL + SHIFT + ] to nove to next window  
#### CTRL + SHIFT + [ to move to prev window
#### CTRL + SHIFT + W  to delete current window 
map ctrl+shift+enter new_tab
map ctrl+shift+]     next_tab
map ctrl+shift+[     previous_tab
map ctrl+shift+q     close_window

#window_border_width 0
window_border_width 2pt 

# BACKGROUND
background_image ~/.config/kitty/kittyBG/arch.jpg
background_image_layout scaled
background_tint 0.98

window_margin_width 5

# TABS
tab_bar_style powerline
tab_powerline_style angled
tab_bar_min_tabs 1
tab_activity_symbol *

# SCROLL
map ctrl+shift+k scroll_line_up
map ctrl+shift+j scroll_line_down
map ctrl+shift+f show_scrollback
map ctrl+shift+o show_last_command_output
#/////////////////////////////////////////////////

#   COLORS — Koda Palette Dark Monochrome

foreground            #a6a6a6
background            #080808
background_opacity    0.965

selection_foreground  #c4c4c4
selection_background  #1a1a1a

cursor                #c4c4c4
cursor_text_color     #080808

url_color             #8a8a8a
active_border_color   #1a1a1a
inactive_border_color #121212
#/////////////////////////////////////////////////
# ───────── ANSI
# black / base
color0   #000000
color8   #3d3d3d

# red / danger
color1   #4a4a4a
color9   #686868

# green
color2   #5c5c5c
color10  #a6a6a6

# yellow / warning
color3   #666666
color11  #b0b0b0

# blue / highlight
color4   #707070
color12  #b8b8b8

# magenta / pink
color5   #7a7a7a
color13  #d0d0d0

# cyan
color6   #848484
color14  #c0c0c0

# white / fg
color7   #a6a6a6
color15  #e0e0e0
#////////////////////////////////////////////////
cursor_shape block
cursor_blink_interval 0.8
shell_integration enabled







